name: JobHuntWidget
options:
  bundleIdPrefix: com.dwyaneramos.jobhuntwidget
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "JR892KH5RJ"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
targets:
  JobHuntApp:
    type: application
    platform: macOS
    sources:
      - path: JobHuntApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwyaneramos.jobhuntwidget.app
        INFOPLIST_FILE: JobHuntApp/Info.plist
        PRODUCT_NAME: JobHunt
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: "YES"
        CODE_SIGN_ENTITLEMENTS: JobHuntApp/JobHuntApp.entitlements
    info:
      path: JobHuntApp/Info.plist
      properties:
        CFBundleDisplayName: JobHunt
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        LSMinimumSystemVersion: "14.0"
    dependencies:
      - target: JobHuntWidgetExtension
        embed: true
        codeSign: false

  JobHuntWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: JobHuntWidgetExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwyaneramos.jobhuntwidget.app.widget
        INFOPLIST_FILE: JobHuntWidgetExtension/Info.plist
        PRODUCT_NAME: JobHuntWidgetExtension
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: JobHuntWidgetExtension/JobHuntWidgetExtension.entitlements
    info:
      path: JobHuntWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: JobHunt Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
